name: "Update README cards on schedule"
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Generate stats card"
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=sLingli&show_icons=true&include_all_commits=true&bg_color=0D1117&title_color=6CABDD&text_color=FFFFFF&icon_color=6CABDD&border_color=30363D"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Generate top languages card"
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=sLingli&layout=compact&langs_count=8&bg_color=0D1117&title_color=6CABDD&text_color=FFFFFF&border_color=30363D"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Commit cards"
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
